<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16212e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bán hàng">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Phần mềm bán hàng</title>
<style>
:root{--bg:#edf0f3;--card:#fff;--ink:#1b2430;--mute:#667085;--line:#d9dee5;--ac:#0f766e;--acd:#0b5a54;--red:#b42318;--hd:#16212e}
*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--hd);color:#fff;display:flex;align-items:center;gap:24px;padding:0 20px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;padding:14px 0;font-weight:700;letter-spacing:.2px}
nav{display:flex;gap:2px}
nav button{background:none;border:0;color:#aab6c5;font:inherit;padding:16px 14px;cursor:pointer;border-bottom:3px solid transparent}
nav button.on{color:#fff;border-color:#2dd4bf}
nav{flex-wrap:wrap}nav button{padding:14px 10px;font-size:14px}
.void td{opacity:.55}.void td:first-child{text-decoration:line-through}.tag{display:inline-block;background:#fde8e6;color:var(--red);border-radius:4px;padding:0 6px;font-size:12px;font-weight:600}
main{padding:18px 20px;max-width:1280px;margin:0 auto}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input,select{font:inherit;padding:9px 11px;border:1px solid var(--line);border-radius:6px;width:100%;background:#fff;color:var(--ink)}
label{display:block;font-size:13px;color:var(--mute);margin-bottom:10px}
label input,label select{margin-top:4px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:16px}
h2{font-size:16px;margin:0 0 12px}
.pri,.ghost{border-radius:6px;padding:10px 16px;border:1px solid var(--ac);font-weight:600}
.pri{background:var(--ac);color:#fff}.pri:hover{background:var(--acd)}
.pri:disabled{background:#9db8b5;border-color:#9db8b5;cursor:not-allowed}
.ghost{background:#fff;color:var(--ac)}.ghost:hover{background:#f0f8f7}
.danger{color:var(--red);border-color:#e3b5b0}
.sell{display:grid;grid-template-columns:1fr 380px;gap:16px;align-items:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.tile{background:#fff;border:1px solid var(--line);border-left:4px solid var(--ac);border-radius:6px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:3px;min-height:92px}
.tile:hover:not(:disabled){border-color:var(--ac);background:#f6fbfa}
.tile:disabled{opacity:.5;border-left-color:#aaa;cursor:not-allowed}
.tile span{color:var(--ac);font-weight:700}
small{color:var(--mute);font-size:12px}
#cart{position:sticky;top:12px;margin:0}
.line{display:grid;grid-template-columns:1fr auto 96px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.line b{display:block;font-weight:600}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:6px;font-size:16px;line-height:1}
.qty span{min-width:20px;text-align:center}
.amt{text-align:right;font-weight:600}
.sum{margin-top:14px}
.row{display:flex;justify-content:space-between;padding:4px 0}
.row.big{font-size:19px;font-weight:700;color:var(--ac);padding:8px 0}
.act{display:flex;gap:10px;margin-top:12px}.act .pri{flex:1}
.empty{color:var(--mute);padding:14px 0}
.form{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto auto;gap:10px;align-items:end}
.form label{margin:0}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:13px;color:var(--mute);font-weight:600}
td.n,th.n{text-align:right}
td button{padding:5px 10px;font-size:13px;margin-left:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:8px;padding:14px}
.stat b{display:block;font-size:22px;color:var(--ac);margin-top:2px}
.tools{display:flex;gap:10px;flex-wrap:wrap}
.low{color:var(--red);font-weight:600}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 13px;color:var(--ink)}
.chips button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.qi{width:68px;padding:5px;text-align:center}
.pg{display:flex;gap:12px;align-items:center;justify-content:flex-end;margin-top:12px}
.fb{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}.fb input{flex:1;min-width:220px}.fb select{width:auto}
.row{align-items:center;gap:10px}
input[type=radio],input[type=checkbox]{width:auto;margin:0 6px 0 0}
.otabs{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.ot{display:flex;background:#fff;border:1px solid var(--line);border-radius:6px}
.ot button{border:0;background:none;padding:8px 12px;color:var(--ink)}
.ot .x{padding:8px 10px;color:var(--mute);border-left:1px solid var(--line)}
.ot.on{border-color:var(--ac);background:#e8f4f2}.ot.on>button:first-child{color:var(--acd);font-weight:600}
.pos{display:grid;grid-template-columns:1fr 390px;gap:16px;align-items:start}
.lc{min-height:480px;margin:0}
.sb{display:flex;gap:10px;margin-bottom:12px}.sb select{width:190px}.sw{position:relative;flex:1}
.res{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 24px rgba(16,24,40,.16);z-index:5;max-height:380px;overflow:auto}
.ri{display:grid;grid-template-columns:84px 1fr auto 74px;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.ri.on,.ri:hover{background:#eef8f6}.ri .cd{color:var(--mute);font-size:12px}.ri b{display:block;font-weight:600}
.lt .qty{justify-content:flex-end}.pi{width:116px;padding:6px 8px;text-align:right}
.x{background:none;border:0;color:var(--mute);font-size:20px;line-height:1}.lt .x:hover{color:var(--red)}
.emp{padding:70px 20px;text-align:center;color:var(--mute)}
.pp{position:sticky;top:12px;margin:0}
.ri2{width:150px;text-align:right}
.chk{display:flex;align-items:center;color:var(--ink);font-size:14px;margin:8px 0}
.pm{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 10px}.pm label{display:flex;align-items:center;margin:0;color:var(--ink);font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}.quick button{border:1px solid var(--line);background:#f4f6f8;border-radius:6px;padding:6px 10px}.quick button:hover{border-color:var(--ac)}
.paybtn{width:100%;font-size:17px;padding:14px;margin-top:10px}
.keys{margin:8px 2px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--hd);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}#toast.on{opacity:1}
@media(max-width:900px){.pos{grid-template-columns:1fr}.pp{position:static}.sb{flex-direction:column}.sb select{width:100%}}
#rc{display:none}
.cinfo{background:#f4f8f7;border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:-4px 0 10px;font-size:13px}
.qc{border:1px dashed var(--ac);border-radius:8px;padding:10px;margin:0 0 10px;display:grid;gap:8px}
@media print{html,body{background:#fff!important}body>*:not(#rc){display:none!important}
 #rc{display:block;color:#000}
 #rc.k80{width:76mm;font:12px/1.4 monospace;margin:0 auto}
 #rc h3{text-align:center;margin:0 0 4px;font-size:15px}#rc .r{display:flex;justify-content:space-between;gap:8px}
 #rc hr{border:0;border-top:1px dashed #000}#rc .c{text-align:center}
 .doc:not(.k80){font:13px/1.45 "Segoe UI",Arial,sans-serif}
 .doc .dh{display:flex;justify-content:space-between;gap:16px;border-bottom:2px solid #000;padding-bottom:8px;margin-bottom:8px}
 .doc .dshop b{font-size:1.2em;text-transform:uppercase}.doc .dtt{text-align:right;white-space:nowrap}.doc .dt{font-size:1.6em;font-weight:700;letter-spacing:.5px}
 .doc .dp{display:grid;grid-template-columns:1fr 1fr;gap:2px 16px;margin:6px 0 10px}.doc .dp span{color:#333}
 .doc .dtb{width:100%;border-collapse:collapse}.doc .dtb th,.doc .dtb td{border:1px solid #000;padding:3px 6px;vertical-align:top}.doc .dtb th{background:#eee;font-weight:700}
 .doc thead{display:table-header-group}.doc tr{page-break-inside:avoid}.doc small{color:#333}
 .doc .dbt{display:grid;grid-template-columns:1.1fr 1fr;gap:16px;margin-top:8px;align-items:start}.doc .dsum{width:100%}.doc .dsum div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}.doc .dsum .b{font-weight:700;font-size:1.1em;border-top:1px solid #000;padding-top:4px}
 .doc .dw{margin:8px 0}.doc .dsg{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;margin-top:12px;page-break-inside:avoid}.doc .dsg div{min-height:74px}.doc .dsg i{display:block;font-size:.85em;color:#444}
 .doc .dft{text-align:center;margin-top:8px;font-size:.9em}
 .doc.a5,.doc.a5l{font-size:10.5px;line-height:1.35}.doc.a5 .dt,.doc.a5l .dt{font-size:1.35em}.doc.a5 .dh,.doc.a5l .dh{padding-bottom:5px;margin-bottom:5px}.doc.a5 .dp,.doc.a5l .dp{margin:4px 0 6px}.doc.a5 .dtb th,.doc.a5 .dtb td,.doc.a5l .dtb th,.doc.a5l .dtb td{padding:2px 5px}.doc.a5 .dsg,.doc.a5l .dsg{margin-top:6px}.doc.a5 .dsg div,.doc.a5l .dsg div{min-height:40px}.doc.a5 .dft,.doc.a5l .dft{margin-top:4px}
}
@media(max-width:900px){.sell{grid-template-columns:1fr}#cart{position:static}.form{grid-template-columns:1fr 1fr}}
html{-webkit-text-size-adjust:100%}
body{overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent}
button,input,select{touch-action:manipulation}
#mbar{display:none}
@media(max-width:700px){
header{position:sticky;top:0;z-index:15;padding:calc(6px + env(safe-area-inset-top)) 14px 6px;gap:0}
header h1{padding:6px 0;font-size:16px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--hd);flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #2a3a4d}
nav button{flex:0 0 auto;padding:13px 14px;border-bottom:0;border-top:3px solid transparent}
nav button.on{border-top-color:#2dd4bf}
main{padding:12px 12px calc(140px + env(safe-area-inset-bottom))}
input,select{font-size:16px}
button{min-height:40px}
.card{padding:12px}.card:not(.lc){overflow-x:auto}.card>table{min-width:540px}#ilines{overflow-x:auto}
.form{grid-template-columns:1fr!important}.form>*{grid-column:auto!important}
.stats{grid-template-columns:1fr 1fr}.stat b{font-size:18px}
.pos{gap:12px}.lc{min-height:0}.keys{display:none}
.otabs{flex-wrap:nowrap;overflow-x:auto}.ot,.otabs>.ghost{flex:0 0 auto;white-space:nowrap}
.res{max-height:50vh}.ri{grid-template-columns:1fr auto}.ri .cd{display:none}
.lt tr:first-child{display:none}
.lt,.lt tbody{display:block}
.lt tr{display:grid;grid-template-columns:1fr 1fr auto;grid-template-areas:"name name x" "qty price amt";gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.lt td{padding:0;border:0}
.lt .c-n,.lt .c-code{display:none}
.lt .c-name{grid-area:name}.lt .c-qty{grid-area:qty;text-align:left}.lt .c-price{grid-area:price}.lt .c-amt{grid-area:amt;align-self:center;font-size:15px}.lt .c-x{grid-area:x;text-align:right}
.lt .c-qty .qty{justify-content:flex-start}.pi{width:100%;min-width:90px}
.ri2{width:130px}
#mbar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:fixed;left:0;right:0;bottom:calc(50px + env(safe-area-inset-bottom));z-index:19;background:#fff;border-top:1px solid var(--line);padding:8px 12px}
#mbar b{font-size:18px;color:var(--ac)}
#toast{bottom:calc(140px + env(safe-area-inset-bottom))}
}
</style>
</head>
<body>
<header>
  <h1 id="shopname"></h1>
  <nav>
    <button data-tab="sell">Bán hàng</button>
    <button data-tab="products">Sản phẩm</button>
    <button data-tab="stock">Kho hàng</button>
    <button data-tab="imports">Nhập hàng</button>
    <button data-tab="suppliers">Nhà cung cấp</button>
    <button data-tab="customers">Khách hàng</button>
    <button data-tab="returns">Trả hàng</button>
    <button data-tab="invoices">Hóa đơn</button>
    <button data-tab="expenses">Chi phí</button>
    <button data-tab="report">Báo cáo</button>
    <button data-tab="settings">Cài đặt</button>
  </nav>
</header>
<main id="main"></main>
<div id="rc"></div>
<div id="toast"></div>
<style id="pgstyle"></style>
<input type="file" id="file" accept=".json" hidden>
<input type="file" id="fcsv" accept=".csv,text/csv" hidden>

<script>
const K='ban_hang_offline_v1';
const DEFCATS=['Gạch men','Sơn nước','Thiết bị vệ sinh','Thiết bị xây dựng','Vật tư phụ'];
const UNITS=['m²','viên','hộp','thùng','lon','bộ','cái','bao','kg','cuộn','mét','gói'];
/* [danh mục, tên, mã, thương hiệu, quy cách, ĐVT, đóng gói, giá vốn, giá lẻ, giá thợ, tồn] - giá chỉ là ví dụ, hãy sửa lại */
const SUG=['Đồ điện','Đồ nước','Hóa chất xây dựng','Xi măng - cát - đá','Sắt thép','Cửa - nhôm kính','Trần - vách thạch cao','Bảo hộ lao động'];
const SAMPLE=[
['Gạch men','Gạch lát nền bóng kiếng','GN6001','Viglacera','60x60 cm, màu kem','m²',1.44,140000,185000,170000,300],
['Gạch men','Gạch ốp tường','GO3060','Prime','30x60 cm, men bóng','m²',1.62,125000,165000,152000,200],
['Gạch men','Gạch granite lát nền','GR8080','Đồng Tâm','80x80 cm, vân đá','m²',1.92,215000,280000,260000,150],
['Gạch men','Gạch chống trơn sân vườn','GS4040','Taicera','40x40 cm','m²',1.6,95000,125000,115000,120],
['Sơn nước','Sơn nội thất Easy Clean','SN18L','Dulux','Thùng 18L, trắng','thùng',0,1900000,2350000,2250000,20],
['Sơn nước','Sơn ngoại thất Jotashield','SN05L','Jotun','Lon 5L','lon',0,950000,1150000,1090000,15],
['Sơn nước','Chống thấm Latex TH','CT05L','Sika','Lon 5L','lon',0,340000,420000,395000,24],
['Thiết bị vệ sinh','Bồn cầu 1 khối','BC504','Inax','C-504, nắp êm','bộ',0,3000000,3850000,3650000,8],
['Thiết bị vệ sinh','Lavabo treo tường','LV001','American Standard','Trắng','cái',0,980000,1250000,1180000,12],
['Thiết bị vệ sinh','Bộ sen tắm nóng lạnh','ST001','Caesar','Inox','bộ',0,1300000,1680000,1580000,10],
['Thiết bị vệ sinh','Vòi lavabo lạnh','VL001','Inax','Mạ chrome','cái',0,470000,620000,580000,20],
['Thiết bị xây dựng','Máy khoan bê tông','MK226','Bosch','GBH 2-26','cái',0,2900000,3650000,3500000,6],
['Thiết bị xây dựng','Máy cắt gạch','MC410','Makita','4100NH, 1200W','cái',0,1950000,2450000,2350000,5],
['Thiết bị xây dựng','Xe rùa','XR001','','Bánh hơi','cái',0,480000,650000,610000,10],
['Vật tư phụ','Keo dán gạch','KD25','Weber','Bao 25kg','bao',0,145000,185000,172000,80],
['Vật tư phụ','Keo chà ron','KR02','Weber','Gói 2kg, nhiều màu','gói',0,32000,45000,41000,100],
['Vật tư phụ','Ke nhựa chữ thập 2mm','KE02','','Gói 100 cái','gói',0,9000,15000,13000,200],
];
const seed=()=>SAMPLE.map(a=>({id:uid(),cat:a[0],name:a[1],code:a[2],brand:a[3],spec:a[4],unit:a[5],box:a[6],cost:a[7],price:a[8],wprice:a[9],stock:a[10],min:a[5]==='m²'?50:5}));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
let db={},idb=null,saveT=0;
function norm(){
  if(!db.ver){try{localStorage.setItem(K+'_v1_backup',JSON.stringify(db))}catch(e){}} /* giữ bản gốc trước khi nâng cấp */
  db.customers=db.customers||[];db.moves=db.moves||[];db.pays=db.pays||[];
  if(!db.cats){ /* dữ liệu cũ: bỏ hàng mẫu cũ chưa bán, nạp danh mục ngành xây dựng */
    db.cats=DEFCATS.slice();
    const used=id=>db.invoices.some(v=>v.items.some(i=>i.id===id));
    db.products=db.products.filter(p=>!['CF01','CF02','TR01','BM01','NS01','BN01'].includes(p.code)||used(p.id));
    if(!db.products.length)db.products=seed();
  }
  db.products.forEach(p=>{p.cost=p.cost||0;p.cat=p.cat||'';p.unit=p.unit||'cái';p.brand=p.brand||'';p.spec=p.spec||'';p.box=p.box||0;p.wprice=p.wprice||0;p.min=p.min||0});
  ['suppliers','imports','returns','expenses','staff','counts'].forEach(k=>db[k]=db[k]||[]);
  db.products.forEach(p=>{p.status=p.status||'on';p.barcode=p.barcode||'';p.created=p.created||Date.now()});
  if((db.ver||0)<3){ /* v2 -> v3: mọi biến động có mã sản phẩm; tồn đầu kỳ để sổ kho cộng ra đúng tồn hiện tại */
    const by={},net={};db.products.forEach(p=>by[p.name]=p);
    db.moves.forEach(m=>{if(!m.pid&&by[m.name])m.pid=by[m.name].id;if(m.before==null)m.before=rd((m.after||0)-m.qty);if(!m.id)m.id=uid();if(m.pid)net[m.pid]=(net[m.pid]||0)+m.qty});
    const t0=db.moves.reduce((a,m)=>Math.min(a,m.time),Date.now())-1;
    db.products.forEach(p=>{const o=rd(p.stock-(net[p.id]||0));if(o)db.moves.push({id:uid(),time:t0,pid:p.id,name:p.name,unit:p.unit,type:'Tồn đầu kỳ',qty:o,before:0,after:o,cost:p.cost||0,ref:'',user:'',note:'Tạo tự động khi nâng cấp lên v3'})});
    db.moves.sort((a,b)=>b.time-a.time);
  }
  db.seqKK=db.seqKK||1;db.allowNeg=!!db.allowNeg;db.paper=db.paper||'A4';
  db.customers.forEach(c=>{if(c.addr===undefined){c.addr=c.note||'';c.note=''}}); /* ô cũ 'Địa chỉ / ghi chú' chuyển thành địa chỉ */
  if(!db.whs||!db.whs.length)db.whs=[{id:'main',name:'Kho chính',note:''}];
  db.locs=db.locs||[];db.xfers=db.xfers||[];db.seqCK=db.seqCK||1;db.defWh=db.defWh||db.whs[0].id;db.saleWh=db.saleWh||db.whs[0].id;
  db.moves.forEach(m=>{if(!m.alloc)m.alloc=[[bk(db.whs[0].id,''),m.qty]]});
  db.products.forEach(p=>{if(!p.bal)p.bal={[bk(db.whs[0].id,'')]:rd(p.stock)};const t=rd(Object.values(p.bal).reduce((a,v)=>a+v,0));if(t!==rd(p.stock)){const k=bk(db.defWh,'');p.bal[k]=rd((p.bal[k]||0)+p.stock-t)}});
  db.vat=db.vat||0;db.prefix=db.prefix||'HD';db.seqPN=db.seqPN||1;db.seqTH=db.seqTH||1;db.invoices.forEach(v=>{v.void=!!v.void});

function drawX(){
  $('#xlines').innerHTML=xf.lines.length?`<table><tr><th>Mặt hàng</th><th class="n">Đang có tại vị trí đi</th><th class="n">Số lượng chuyển</th><th></th></tr>${xf.lines.map((l,k)=>{const p=prod(l.id);return `<tr><td>${esc(p.name)}<br><small>${esc(p.unit)}</small></td><td class="n">${rd(balOf(p,xf.fw,xf.fl))}</td><td class="n"><input class="pi xq" type="number" min="0" step="any" data-i="${k}" value="${l.qty}"></td><td><button class="x" data-xrm="${k}">×</button></td></tr>`}).join('')}</table>`:'<div class="emp" style="padding:24px">Chưa có dòng hàng. Gõ mã hoặc tên hàng ở ô trên rồi chọn.</div>';
  document.querySelectorAll('.xq').forEach(el=>el.oninput=()=>{xf.lines[+el.dataset.i].qty=Math.max(0,+el.value||0)});

function addX(){
  const p=findP($('#xpr').value);if(!p)return alert('Không tìm thấy sản phẩm. Hãy chọn từ danh sách gợi ý.');
  const l=xf.lines.find(x=>x.id===p.id);if(l)l.qty=rd(l.qty+1);else xf.lines.push({id:p.id,qty:1});
  $('#xpr').value='';drawX();

function saveXf(){
  const L=xf.lines.filter(l=>l.qty>0);if(!L.length)return alert('Phiếu chuyển chưa có mặt hàng.');
  const f={w:xf.fw,l:xf.fl},t={w:xf.tw,l:xf.tl};

  const bad=L.find(l=>balOf(prod(l.id),f.w,f.l)<l.qty);

  const no='CK'+String(db.seqCK++).padStart(4,'0');
  db.xfers.unshift({no,time:Date.now(),from:f,to:t,note:xf.note.trim(),user:stfName(),items:L.map(l=>{const p=prod(l.id);xferMove(p,l.qty,f,t,no);return{id:p.id,name:p.name,unit:p.unit,qty:l.qty}})});

  $('#ilines').innerHTML=imp.lines.length?`<table><tr><th>Mặt hàng</th><th class="n">Số lượng</th><th class="n">Giá vốn nhập</th><th class="n">Thành tiền</th><th></th></tr>${imp.lines.map((l,k)=>{const p=prod(l.id),ur=urates(p),r=(ur[l.u||0]||ur[0]).rate;return `<tr><td>${esc(p.name)}<br><small>${esc(p.unit)}, tồn ${rd(p.stock)}, giá vốn hiện tại ${money(p.cost)}</small></td><td class="n"><input class="iq pi" type="number" min="0" step="any" data-i="${k}" value="${rd(l.qty/r)}">${ur.length>1?`<select class="iu" data-i="${k}">${ur.map((u,x)=>`<option value="${x}" ${x===(l.u||0)?'selected':''}>${esc(u.name)}</option>`).join('')}</select>`:' '+esc(p.unit)}</td><td class="n"><input class="ic pi" type="number" min="0" data-i="${k}" value="${rd(l.cost*r)}"></td><td class="n" id="ia${k}">${money(l.qty*l.cost)}</td><td><button class="x" data-irm="${k}">×</button></td></tr>`}).join('')}</table>`:'<div class="emp" style="padding:24px">Chưa có dòng hàng. Gõ tên hoặc mã hàng ở ô trên rồi chọn.</div>';
  document.querySelectorAll('.iq,.ic').forEach(el=>el.oninput=()=>{const l=imp.lines[+el.dataset.i],r=urates(prod(l.id))[l.u||0].rate,v=Math.max(0,+el.value||0);if(el.classList.contains('iq'))l.qty=rd(v*r);else l.cost=v/r;$('#ia'+el.dataset.i).textContent=money(l.qty*l.cost);itot()});
  document.querySelectorAll('.iu').forEach(el=>el.onchange=()=>{imp.lines[+el.dataset.i].u=+el.value;drawI()});
  itot();
}
function addImp(){
  const el=$('#ipr'),v=el.value.trim().toLowerCase();if(!v)return;
  const p=db.products.find(x=>plab(x).toLowerCase()===v)||db.products.find(x=>x.name.toLowerCase()===v||(x.code||'').toLowerCase()===v);
  if(!p)return alert('Không tìm thấy sản phẩm. Hãy chọn từ danh sách gợi ý, hoặc thêm sản phẩm ở thẻ Sản phẩm trước.');
  const l=imp.lines.find(x=>x.id===p.id);
  if(l)l.qty=rd(l.qty+stepOf(l,p));else imp.lines.push({id:p.id,qty:p.box||1,cost:p.cost||0,u:0});
  el.value='';drawI();
}
function saveImp(){
  const L=imp.lines.filter(l=>l.qty>0);
  if(!L.length)return alert('Phiếu nhập chưa có mặt hàng nào.');
  const s=db.suppliers.find(x=>x.id===imp.sid),upc=$('#icost').checked,w=imp.wid||db.defWh,lc=imp.lid||'';
  const old=imp.edit?db.imports.find(x=>x.no===imp.edit):null;
  if(imp.edit&&!old){imp={sid:'',note:'',lines:[]};return impView()}
  if(old){ /* sửa phiếu: kiểm tra rồi hoàn bản cũ, sổ kho ghi cả hai bước */
    const ow=old.wid||db.defWh,ol=old.lid||'';
    for(const it of old.items){
      const p=prod(it.id);if(!p)return alert(`Sản phẩm "${it.name}" của phiếu cũ đã bị xóa nên không sửa được phiếu này.`);
      const nq=L.filter(l=>l.id===it.id).reduce((t,l)=>t+l.qty,0),same=bk(ow,ol)===bk(w,lc);
      if(!db.allowNeg&&(balOf(p,ow,ol)-it.qty+(same?nq:0)<0||p.stock-it.qty+nq<0))return alert(`Không sửa được: sau khi trừ phiếu cũ, "${p.name}" sẽ bị âm tồn vì hàng đã bán hoặc đã chuyển đi. Hãy kiểm tra lại số lượng.`);
    }
    old.items.forEach(it=>{const p=prod(it.id);p.stock=rd(p.stock-it.qty);mv(p,'Sửa phiếu nhập (trừ bản cũ)',-it.qty,'',old.no,{alloc:[[bk(old.wid||db.defWh,old.lid||''),-it.qty]]})});
  }
  const no=old?old.no:'PN'+String(db.seqPN++).padStart(4,'0');
  const items=L.map(l=>{const p=prod(l.id),b=Math.max(0,p.stock);if(upc)p.cost=b+l.qty>0?Math.round((b*(p.cost||0)+l.qty*l.cost)/(b+l.qty)):l.cost;p.stock=rd(p.stock+l.qty);mv(p,old?'Nhập (sau khi sửa phiếu)':'Nhập',l.qty,s?s.name:'',no,{wid:w,lid:lc});return{id:p.id,name:p.name,unit:p.unit,qty:l.qty,cost:l.cost}});
  const rec={no,time:old?old.time:Date.now(),sid:s?s.id:'',sname:s?s.name:'',items,total:items.reduce((t,i)=>t+i.qty*i.cost,0),wid:w,lid:lc,note:imp.note.trim()};
  if(old)Object.assign(old,rec,{edited:Date.now()});else db.imports.unshift(rec);
  imp={sid:'',note:'',lines:[]};save();impView();toast((old?'Đã lưu thay đổi phiếu ':'Đã lưu phiếu nhập ')+no);
}

function retView(){
  const v=db.invoices.find(x=>x.no===retNo&&!x.void),r=v&&v.sub?(v.total-(v.fee||0))/v.sub:1,X=retEdit?db.returns.find(z=>z.no===retEdit):null,oq=i=>X?((X.items.find(z=>z.id===i.id)||{}).qty||0):0;
  $('#main').innerHTML=`<div class="card"><h2>${X?'Sửa phiếu trả hàng '+X.no+' <button class="ghost" data-redcancel>Hủy sửa</button>':'Trả hàng'}</h2><label style="max-width:420px">Chọn hóa đơn cũ (gõ hoặc chọn số hóa đơn)<input id="rno" list="invl" value="${esc(retNo)}" placeholder="Ví dụ HD0005" autocomplete="off"></label>

  <label style="margin-top:12px">Lý do / ghi chú<input id="rnote" value="${esc(X?X.note||'':'')}"></label>
  <div class="row big"><span>Tổng tiền hoàn lại</span><span id="rtot">${X?money(X.total):'0đ'}</span></div>
  <p><small>Tiền hoàn đã tính theo giảm giá${v.vat?' và VAT':''} của hóa đơn gốc. Nếu khách còn nợ hóa đơn này, phần hoàn sẽ ưu tiên trừ vào công nợ.</small></p>
  <button class="pri" data-rsave>${X?'Lưu thay đổi phiếu':'Xác nhận trả hàng'}</button>`:''}</div>
  <div class="card"><div class="tools" style="justify-content:space-between;align-items:center;margin-bottom:10px"><h2 style="margin:0">Lịch sử trả hàng (${db.returns.length})</h2>${paperSel()}</div><table><tr><th>Số phiếu</th><th>Thời gian</th><th>Hóa đơn gốc</th><th>Hàng trả</th><th class="n">Tiền hoàn</th><th></th></tr>${db.returns.map(x=>`<tr><td>${x.no}</td><td>${fmtT(x.time)}</td><td>${x.inv}<br><small>${esc(x.cname||'')}</small></td><td>${esc(x.items.map(i=>i.name+' ×'+i.qty).join(', '))}${x.note?'<br><small>'+esc(x.note)+'</small>':''}</td><td class="n">${money(x.total)}${x.cut?'<br><small>trừ nợ '+money(x.cut)+'</small>':''}${x.edited?'<br><small>đã sửa</small>':''}</td><td class="n"><button class="ghost" data-rprint="${x.no}">In</button><button class="ghost" data-redit="${x.no}">Sửa</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">Chưa có phiếu trả hàng.</td></tr>'}</table></div>`;
  $('#rno').onchange=e=>{retNo=e.target.value.trim().toUpperCase();retEdit=null;retView()};
  document.querySelectorAll('.rq').forEach(el=>el.oninput=()=>{
    const i=v.items[+el.dataset.ri],mx=rd(i.qty-((i.ret||0)-oq(i)));let q=Math.max(0,+el.value||0);if(q>mx){q=mx;el.value=mx}
    $('#rr'+el.dataset.ri).textContent=q?money(Math.round(q*i.price*r)):'—';
    let t=0;document.querySelectorAll('.rq').forEach(x=>{const j=v.items[+x.dataset.ri];t+=Math.min(+x.value||0,rd(j.qty-((j.ret||0)-oq(j))))*j.price});
    $('#rtot').textContent=money(Math.round(t*r));
  });
}
function saveRet(){
  const v=db.invoices.find(x=>x.no===retNo&&!x.void);if(!v)return;
  const X=retEdit?db.returns.find(z=>z.no===retEdit):null,oq=i=>X?((X.items.find(z=>z.id===i.id)||{}).qty||0):0;
  const r=v.sub?(v.total-(v.fee||0))/v.sub:1,L=[];
  document.querySelectorAll('.rq').forEach(el=>{const k=+el.dataset.ri,i=v.items[k],q=Math.min(+el.value||0,rd(i.qty-((i.ret||0)-oq(i))));if(q>0)L.push([k,q])});
  if(!L.length)return alert('Nhập số lượng trả cho ít nhất một sản phẩm.');
  if(X){ /* sửa phiếu: kiểm tra rồi hoàn bản cũ (tồn, số lượng đã trả, công nợ) */
    for(const it of X.items){const p=prod(it.id),nq=(L.find(([k])=>v.items[k].id===it.id)||[0,0])[1];if(p&&!db.allowNeg&&p.stock-it.qty+nq<0)return alert(`Không sửa được: sau khi trừ phiếu trả cũ, "${p.name}" sẽ bị âm tồn vì hàng trả đã được bán lại.`)}
    X.items.forEach(it=>{const vi=v.items.find(z=>z.id===it.id),p=prod(it.id);if(vi)vi.ret=rd((vi.ret||0)-it.qty);if(p){p.stock=rd(p.stock-it.qty);mv(p,'Sửa phiếu trả (trừ bản cũ)',-it.qty,X.no,X.no,it.alloc?{alloc:it.alloc.map(([k,q])=>[k,-q])}:{})}});
    const c0=db.customers.find(x=>x.id===v.cid);if(c0&&X.cut){c0.debt=(c0.debt||0)+X.cut;v.debtCut=Math.max(0,(v.debtCut||0)-X.cut)}
  }
  const no=X?X.no:'TH'+String(db.seqTH++).padStart(4,'0');
  const items=L.map(([k,q])=>{const i=v.items[k],p=prod(i.id);let al;i.ret=rd((i.ret||0)+q);if(p){p.stock=rd(p.stock+q);mv(p,X?'Trả hàng (sau khi sửa phiếu)':'Trả hàng',q,no+' ('+v.no+')',no);al=db.moves[0].alloc}return{id:i.id,name:i.name,unit:i.unit,cat:i.cat,qty:q,price:i.price,cost:i.cost||0,alloc:al}});
  const total=Math.round(items.reduce((t,i)=>t+i.qty*i.price,0)*r),c=db.customers.find(x=>x.id===v.cid);let cut=0;
  if(c&&v.debt){cut=Math.max(0,Math.min(total,c.debt||0,(v.debt||0)-(v.debtCut||0)));c.debt-=cut;v.debtCut=(v.debtCut||0)+cut}
  const rec={no,time:X?X.time:Date.now(),inv:v.no,cname:v.cname,items,total,cut,note:$('#rnote').value.trim()};
  if(X)Object.assign(X,rec,{edited:Date.now()});else db.returns.unshift(rec);
  save();retNo='';retEdit=null;retView();toast(`${X?'Đã lưu thay đổi':'Đã lưu'} ${no}, hoàn khách ${money(total-cut)}`);
}

/* ---------- In phiếu: A4, A5 dọc, A5 ngang, phiếu nhiệt 80mm ---------- */
const PAPERS={A4:{css:'size:A4 portrait;margin:10mm',cls:'a4'},A5:{css:'size:A5 portrait;margin:7mm',cls:'a5'},A5L:{css:'size:A5 landscape;margin:7mm',cls:'a5l'},K80:{css:'size:80mm auto;margin:3mm',cls:'k80'}};
const paperSel=()=>`<label style="margin:0;display:flex;gap:6px;align-items:center;white-space:nowrap">Khổ giấy in<select class="psel" style="width:auto">${[['A4','A4 dọc'],['A5','A5 dọc'],['A5L','A5 ngang'],['K80','Nhiệt 80mm']].map(([v,l])=>`<option value="${v}" ${(db.paper||'A4')===v?'selected':''}>${l}</option>`).join('')}</select></label>`;
document.addEventListener('change',e=>{if(e.target.classList&&e.target.classList.contains('psel')){db.paper=e.target.value;save()}});
function vnWords(n){
  n=Math.round(Math.abs(n));if(!n)return 'không';
  const d=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'],U=['','nghìn','triệu','tỷ','nghìn tỷ','triệu tỷ'];
  const three=(x,full)=>{const t=Math.floor(x/100),c=Math.floor(x/10)%10,u=x%10;let r='';
    if(t>0||full)r+=d[t]+' trăm';
    if(c>1){r+=' '+d[c]+' mươi';if(u===1)r+=' mốt';else if(u===4)r+=' tư';else if(u===5)r+=' lăm';else if(u>0)r+=' '+d[u]}
    else if(c===1){r+=' mười';if(u===5)r+=' lăm';else if(u>0)r+=' '+d[u]}
    else if(u>0){if(t>0||full)r+=' lẻ';r+=' '+d[u]}
    return r.trim()};
  const g=[];let m=n;while(m>0){g.push(m%1000);m=Math.floor(m/1000)}
  const out=[];for(let i=g.length-1;i>=0;i--){if(!g[i])continue;out.push(three(g[i],i<g.length-1)+(U[i]?' '+U[i]:''))}
  return out.join(' ');
}
const moneyWords=n=>{const w=vnWords(n);return w.charAt(0).toUpperCase()+w.slice(1)+' đồng chẵn.'};
function printDoc(c){
  const pp=PAPERS[db.paper]||PAPERS.A4,e=esc,foot=e((c.foot||db.shopFoot||'Cảm ơn quý khách!').trim());
  $('#pgstyle').textContent='@page{'+pp.css+'}';$('#rc').className='doc '+pp.cls;
  if(pp.cls==='k80'){
    const r=(a,b)=>`<div class="r"><span>${a}</span><span>${b}</span></div>`;
    $('#rc').innerHTML=`<h3>${e(db.shop)}</h3>${db.shopAddr?'<div class="c">'+e(db.shopAddr)+'</div>':''}${db.shopPhone?'<div class="c">ĐT: '+e(db.shopPhone)+'</div>':''}<hr><div class="c"><b>${c.title}</b></div><div class="c">${e(c.no)} - ${c.time}</div>${c.parties.map(([l,v])=>`<div>${l}: ${v}</div>`).join('')}<hr>${c.rows.map(x=>r(x.k[0],x.k[1])).join('')}<hr>${c.sums.map(([l,v,b])=>r(b?'<b>'+l+'</b>':l,b?'<b>'+v+'</b>':v)).join('')}${c.note?'<div>Ghi chú: '+e(c.note)+'</div>':''}<hr><div class="c">${foot}</div>`;
  }else{
    $('#rc').innerHTML=`<div class="dh"><div class="dshop"><b>${e(db.shop)}</b>${db.shopAddr?'<div>Địa chỉ: '+e(db.shopAddr)+'</div>':''}${db.shopPhone?'<div>Điện thoại: '+e(db.shopPhone)+'</div>':''}${db.shopTax?'<div>Mã số thuế: '+e(db.shopTax)+'</div>':''}</div><div class="dtt"><div class="dt">${c.title}</div><div>Số: <b>${e(c.no)}</b></div><div>Ngày: ${c.time}</div></div></div>
    <div class="dp">${c.parties.map(([l,v])=>`<div><span>${l}:</span> ${v}</div>`).join('')}</div>
    <table class="dtb"><thead><tr><th style="width:9mm;text-align:center">STT</th>${c.cols.map(k=>`<th style="text-align:${k[1]||'left'}${k[2]?';width:'+k[2]:''}">${k[0]}</th>`).join('')}</tr></thead><tbody>${c.rows.map((x,i)=>`<tr><td style="text-align:center">${i+1}</td>${x.c.map((t,j)=>`<td style="text-align:${c.cols[j][1]||'left'}">${t}</td>`).join('')}</tr>`).join('')}</tbody></table>
    <div class="dbt"><div class="dleft"><div class="dw"><b>Bằng chữ:</b> ${e(moneyWords(c.words))}</div>${c.note?'<div><b>Ghi chú:</b> '+e(c.note)+'</div>':''}${c.bank&&db.shopBank?'<div><b>Tài khoản ngân hàng:</b> '+e(db.shopBank)+'</div>':''}</div><div class="dsum">${c.sums.map(([l,v,b])=>`<div class="${b?'b':''}"><span>${l}</span><span>${v}</span></div>`).join('')}</div></div>
    <div class="dsg">${c.sign.map(t=>`<div><b>${t}</b><i>(Ký, ghi rõ họ tên)</i></div>`).join('')}</div>
    <div class="dft">${foot}</div>`;
  }
  window.print();
}

function resetAll(){
  if(!confirm('CẢNH BÁO: thao tác này xóa TOÀN BỘ dữ liệu gồm sản phẩm, kho, khách hàng, hóa đơn, phiếu nhập, phiếu trả, chi phí, nhân viên và cài đặt cửa hàng. Không thể hoàn tác.\n\nBạn có chắc chắn muốn tiếp tục?'))return;
  const w=prompt('Xác nhận lần 2. Gõ chính xác cụm từ XOA HET (viết hoa, có dấu cách) rồi bấm OK để xóa vĩnh viễn:');
  if(w===null)return;
  if(w.trim()!=='XOA HET')return alert('Nội dung gõ không đúng nên chưa xóa gì. Dữ liệu vẫn được giữ nguyên.');
  try{dl('sao-luu-truoc-khi-xoa-'+stamp()+'.json',JSON.stringify(db),'application/json')}catch(e){} /* tự tải bản sao lưu cuối cùng */
  db=blankDb();norm();
  try{localStorage.removeItem(K);localStorage.removeItem(K+'_v1_backup')}catch(e){}
  const done=()=>location.reload();
  if(idb){const tx=idb.transaction('kv','readwrite');tx.objectStore('kv').put(db,'db');tx.oncomplete=done;tx.onerror=done}
  else{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}done()}
}

  else if(d.print)printInv(db.invoices.find(v=>v.no===d.print));

  else if('qcnew' in d){qcOpen=true;drawPanel()}
  else if('qccancel' in d){qcOpen=false;drawPanel()}

  else if(d.iprint)printImport(d.iprint);

  else if(d.rprint)printReturn(d.rprint);
  else if(d.redit)editRet(d.redit);
  else if('redcancel' in d){retEdit=null;retNo='';retView()}
  else if('reset' in d)resetAll();
  else if('aadd' in d)addAttr();
  else if(d.aren)renAttr(d.aren);
  else if(d.aval)valAttr(d.aval);
  else if(d.adel)delAttr(d.adel);

  else if(d.urm){uRows.splice(+d.urm,1);drawUnits()}

  else if(d.xrm){xf.lines.splice(+d.xrm,1);drawX()}
  else if('xclear' in d){xf.lines=[];xf.note='';xfView()}
  else if('xsave' in d)saveXf();
  else if('waddw' in d)addWh();
  else if(d.wren)renWh(d.wren);
  else if(d.wlock)lockWh(d.wlock);
  else if(d.wdel)delWh(d.wdel);
  else if('waddl' in d)addLoc();
  else if(d.lren)renLoc(d.lren);
  else if(d.ldel)delLoc(d.ldel);
  else if(d.pg){const[k,n]=d.pg.split(':');PG[k]=+n;({pl:drawPL,sl:drawSL,lg:drawLG,kk:drawKK})[k]()}
  else if(d.kt){kt=d.kt;stockView()}
  else if(d.card){card=d.card;kt='lg';PG.lg=1;stockView()}
  else if('cardx' in d){card=null;kLG()}
  else if(d.pstat){const x=prod(d.pstat);x.status=x.status==='off'?'on':'off';save();drawPL()}
  else if('csvtpl' in d)csvTpl();
  else if('csvimp' in d)$('#fcsv').click();

  else if('ipx' in d){ipv=null;products()}

  else if(d.kkopen){kkOpen=d.kkopen;kkQ='';kkF='';PG.kk=1;kKK()}
  else if('kkback' in d){kkOpen=null;kKK()}

  else if('kkdel' in d){if(confirm('Xóa phiên kiểm kê đang làm dở? Chưa có điều chỉnh nào được ghi vào kho.')){db.counts=db.counts.filter(x=>x.id!==kkOpen);kkOpen=null;save();kKK()}}

$('#file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.products||!d.invoices)throw 0;
    if(confirm('Thay toàn bộ dữ liệu hiện tại bằng bản sao lưu này?')){db=d;norm();save();orderSeq=0;orders=[newOrder()];cur=0;go('report')}}
    catch(x){alert('File sao lưu không hợp lệ.')}};
  r.readAsText(f);e.target.value='';
};
$('#fcsv').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>csvRead(r.result);r.readAsText(f,'UTF-8');e.target.value=''};
boot();

if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
